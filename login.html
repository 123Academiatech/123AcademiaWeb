<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Iniciar Sesión - 123AcademiaTech</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0B1B3D",
            "primary-dark": "#050C1D",
            "primary-container": "#0B1B3D",
            "secondary": "#FF6B00",
            "secondary-hover": "#E55A00",
            "secondary-container": "#FE6B00",
            "background": "#F8FAFC",
            "surface": "#FFFFFF",
            "surface-low": "#F1F5F9",
            "on-surface": "#0F172A",
            "on-surface-variant": "#475569"
          },
          fontFamily: {
            "headline": ["Montserrat", "sans-serif"],
            "body": ["Inter", "sans-serif"]
          },
          maxWidth: {
            "container-max": "1320px"
          }
        }
      }
    }
  </script>
  <style>
    .glass-panel {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background-color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .shadow-luxury {
      box-shadow: 0 10px 30px -5px rgba(11, 27, 61, 0.08), 0 4px 12px -2px rgba(11, 27, 61, 0.04);
    }
    .tab-active {
      background-color: #FFFFFF !important;
      color: #0B1B3D !important;
      border-bottom: 2px solid transparent !important;
      box-shadow: 0 -4px 15px rgba(11, 27, 61, 0.05);
    }
    .tab-inactive {
      background-color: #E2E8F0 !important;
      color: #64748B !important;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-on-surface font-body antialiased min-h-screen flex flex-col selection:bg-secondary selection:text-white" data-page="login">

  <!-- HEADER / NAVEGACIÓN TOTALMENTE EN LA PARTE SUPERIOR -->
  <div id="app-header"></div>

  <!-- MAIN LOGIN CONTAINER -->
  <main class="flex-grow flex items-center justify-center p-6 py-8">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 md:p-10 border border-slate-100 shadow-luxury space-y-6">
      <div class="text-center space-y-2">
        <a href="index.html" class="inline-flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-primary flex items-center justify-center text-white shadow-md">
            <span class="material-symbols-outlined text-2xl text-secondary">terminal</span>
          </div>
          <span class="font-headline font-extrabold text-[19px] text-primary">123Academia<span class="text-secondary">Tech</span></span>
        </a>
        <h2 class="font-headline font-bold text-[23px] text-primary pt-2">Iniciar Sesión</h2>
        <p class="text-xs text-slate-500">Accede a tu cuenta de estudiante o al panel de administración.</p>
      </div>

      <!-- PESTAÑAS DE NAVEGACIÓN (LOGIN / REGISTRO) -->
      <div class="flex items-center rounded-2xl bg-slate-100 p-1 border border-slate-200">
        <button id="btn-tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-xl font-headline font-bold text-xs transition-all bg-white text-primary shadow-sm">
          Iniciar Sesión
        </button>
        <button id="btn-tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2.5 rounded-xl font-headline font-bold text-xs transition-all text-slate-500 hover:text-primary">
          Crear Cuenta (Registro)
        </button>
      </div>

      <!-- FORMULARIO 1: INICIAR SESIÓN -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Correo Electrónico</label>
          <input required type="email" placeholder="admin@123academiatech.com" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>
        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Contraseña</label>
          <input required type="password" placeholder="••••••••" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>

        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 text-slate-600">
            <input type="checkbox" class="rounded text-secondary focus:ring-secondary"/>
            Recordarme
          </label>
          <a href="#" class="text-secondary font-semibold hover:underline">¿Olvidaste tu clave?</a>
        </div>

        <button type="submit" class="w-full py-2.5 rounded-xl bg-secondary hover:bg-secondary-hover text-white font-headline font-bold text-sm shadow-md hover:shadow-lg transition-all">
          INICIAR SESIÓN
        </button>
      </form>

      <!-- FORMULARIO 2: CREAR CUENTA (REGISTRO BASE DE DATOS - NIVEL 1) -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div class="p-3 rounded-2xl bg-blue-50/80 border border-blue-200/80 text-xs text-primary flex items-center gap-2">
          <span class="material-symbols-outlined text-secondary text-lg shrink-0">info</span>
          <span>Al registrarte, tu cuenta se creará en la base de datos con **Nivel 1 (Visitante)** de forma inmediata.</span>
        </div>

        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Nombre Completo</label>
          <input required type="text" placeholder="Ej: Carlos Pérez" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>
        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Correo Electrónico</label>
          <input required type="email" placeholder="usuario@correo.com" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>
        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Teléfono (WhatsApp)</label>
          <input type="tel" placeholder="+58 412 1234567" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>
        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Contraseña</label>
          <input required type="password" minlength="6" placeholder="••••••••" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>

        <button type="submit" class="w-full py-2.5 rounded-xl bg-primary hover:bg-primary-dark text-white font-headline font-bold text-sm shadow-md hover:shadow-lg transition-all">
          CREAR CUENTA (NIVEL 1)
        </button>
      </form>

      <div class="text-center pt-4 border-t border-slate-100">
        <a href="index.html" class="text-xs font-headline font-semibold text-slate-500 hover:text-primary">← Volver al Inicio</a>
      </div>
    </div>
  </main>

  <!-- FOOTER (STANDARDIZED LUXURY FULL WIDTH) -->
  <div id="app-footer"></div>
  <div id="app-cart-drawer"></div>

  <!-- SCRIPTS -->
  <script src="supabase-client.js"></script>
  <script>
    // Mostrar Panel CRUD solo si es Administrador (Nivel 4)
    if (localStorage.getItem('123_is_admin') === 'true' && Number(localStorage.getItem('123_user_nivel')) === 4) {
      document.querySelectorAll('.admin-only-link').forEach(el => el.classList.remove('hidden'));
    }

    // Comprobar si el usuario fue redirigido por acceso restringido
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('restricted') === 'true') {
        const formContainer = document.querySelector('form');
        if (formContainer) {
          const banner = document.createElement('div');
          banner.className = 'mb-6 p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-start gap-3 shadow-sm';
          banner.innerHTML = `
            <span class="material-symbols-outlined text-rose-600 text-xl shrink-0 mt-0.5">lock</span>
            <div>
              <strong class="block text-sm font-bold text-rose-800">Zona Restringida</strong>
              El Panel CRUD está reservado exclusivamente para la cuenta de Administrador. Por favor inicia sesión con tus credenciales de Administrador.
            </div>
          `;
          formContainer.parentNode.insertBefore(banner, formContainer);
        }
      }
    });

    function switchAuthTab(tab) {
      const btnLogin = document.getElementById('btn-tab-login');
      const btnRegister = document.getElementById('btn-tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      if (tab === 'register') {
        btnLogin.className = "flex-1 py-2.5 rounded-xl font-headline font-bold text-xs transition-all text-slate-500 hover:text-primary";
        btnRegister.className = "flex-1 py-2.5 rounded-xl font-headline font-bold text-xs transition-all bg-white text-primary shadow-sm";
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
      } else {
        btnLogin.className = "flex-1 py-2.5 rounded-xl font-headline font-bold text-xs transition-all bg-white text-primary shadow-sm";
        btnRegister.className = "flex-1 py-2.5 rounded-xl font-headline font-bold text-xs transition-all text-slate-500 hover:text-primary";
        formRegister.classList.add('hidden');
        formLogin.classList.remove('hidden');
      }
    }

    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      if (menu) menu.classList.toggle('hidden');
    }

    async function handleRegister(e) {
      e.preventDefault();
      const inputs = e.target.querySelectorAll('input');
      const name = inputs[0].value.trim();
      const email = inputs[1].value.trim();
      const phone = inputs[2].value.trim();
      const password = inputs[3].value;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="material-symbols-outlined text-sm animate-spin">sync</span> Registrando usuario...`;
      }

      try {
        await SupabaseAPI.register(name, email, password, phone);
        alert('¡Registro completado exitosamente! Tu cuenta ha sido creada con Nivel 1 (Visitante).');
        window.location.href = "index.html";
      } catch (err) {
        console.error('Error durante registro:', err);
        alert('Error en registro: ' + (err.message || 'No se pudo completar el registro'));
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `CREAR CUENTA (NIVEL 1)`;
        }
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const inputs = e.target.querySelectorAll('input');
      const email = inputs[0].value.trim();
      const password = inputs[1].value;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="material-symbols-outlined text-sm animate-spin">sync</span> Autenticando con Supabase...`;
      }

      try {
        await SupabaseAPI.login(email, password);
        window.location.href = "admin.html";
      } catch (err) {
        console.error('Error durante autenticación:', err);
        alert('Error de inicio de sesión en Supabase Auth: ' + (err.message || 'Credenciales inválidas'));
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `INICIAR SESIÓN`;
        }
      }
    }

    function selectAudience(type) {
      localStorage.setItem('audience_preference', type);
      window.location.href = `index.html?audience=${type}`;
    }
  </script>
  <script src="auth-nav.js"></script>
  <script src="components.js"></script>
</body>
</html>
