<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Crear Cuenta - 123AcademiaTech</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="dist/styles.css"/>
</head>
<body class="bg-[#F8FAFC] text-on-surface font-body antialiased min-h-screen flex flex-col selection:bg-secondary selection:text-white" data-page="registro">

  <!-- HEADER DINÁMICO CENTRALIZADO -->
  <div id="app-header"></div>

  <!-- MAIN REGISTRO CONTAINER -->
  <main class="flex-grow flex items-center justify-center p-6 py-10">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 md:p-10 border border-slate-100 shadow-luxury space-y-6">
      <div class="text-center space-y-2">
        <a href="index.html" class="inline-flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-primary flex items-center justify-center text-white shadow-md">
            <span class="material-symbols-outlined text-2xl text-secondary">terminal</span>
          </div>
          <span class="font-headline font-extrabold text-[19px] text-primary">123Academia<span class="text-secondary">Tech</span></span>
        </a>
        <h2 class="font-headline font-bold text-[23px] text-primary pt-2">Crear Cuenta</h2>
        <p class="text-xs text-slate-500">Regístrate para acceder a nuestros cursos e insumos de taller.</p>
      </div>

      <!-- FORMULARIO DE REGISTRO CON PROTECCIÓN ANTI-BOT -->
      <form onsubmit="handleRegisterPage(event)" class="space-y-4">
        <!-- Honeypot invisible para captura de bots automatizados -->
        <div class="hidden" style="display: none !important; position: absolute; left: -9999px; opacity: 0;" aria-hidden="true">
          <input type="text" id="reg-website-hp" name="website_verification_code" tabindex="-1" autocomplete="off" />
        </div>

        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Nombre Completo</label>
          <input id="reg-nombre" required type="text" placeholder="Ej: Carlos Pérez" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>

        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Correo Electrónico</label>
          <input id="reg-email" required type="email" placeholder="usuario@correo.com" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>

        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Fecha de Nacimiento</label>
          <input id="reg-birthdate" required type="date" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>

        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Contraseña</label>
          <input id="reg-password" required type="password" minlength="6" placeholder="••••••••" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>

        <div>
          <label class="block text-xs font-headline font-bold text-slate-700 mb-1">Confirmar Contraseña</label>
          <input id="reg-confirm-password" required type="password" minlength="6" placeholder="••••••••" class="w-full p-3.5 rounded-xl border border-slate-200 text-sm focus:border-secondary focus:ring-secondary"/>
        </div>

        <button id="reg-submit-btn" type="submit" class="w-full py-2.5 rounded-xl bg-primary hover:bg-primary-dark text-white font-headline font-bold text-sm shadow-md hover:shadow-lg transition-all">
          CREAR CUENTA
        </button>
      </form>

      <div class="text-center pt-4 border-t border-slate-100 flex flex-col gap-2 text-xs">
        <p class="text-slate-500">¿Ya tienes una cuenta? <a href="login.html" class="text-secondary font-headline font-bold hover:underline">Iniciar Sesión</a></p>
        <a href="index.html" class="font-headline font-semibold text-slate-400 hover:text-primary">← Volver al Inicio</a>
      </div>
    </div>
  </main>

  <!-- FOOTER DINÁMICO CENTRALIZADO -->
  <div id="app-footer"></div>
  <div id="app-cart-drawer"></div>

  <!-- SCRIPTS -->
  <script src="supabase-client.js"></script>
  <script>
    let _lastRegisterAttempt = 0;

    async function handleRegisterPage(e) {
      e.preventDefault();

      // 1. Detección de Bot automatizado (Honeypot Trap)
      const honeypot = document.getElementById('reg-website-hp');
      if (honeypot && honeypot.value.trim() !== '') {
        console.warn('Bot submission blocked via Honeypot.');
        // Descartar silenciosamente para desorientar al bot sin consumir recursos
        return;
      }

      // 2. Cooldown de interfaz anti-ráfaga (mínimo 5s entre clics locales)
      const now = Date.now();
      if (now - _lastRegisterAttempt < 5000) {
        alert('Por favor espera unos segundos antes de reenviar el formulario.');
        return;
      }
      _lastRegisterAttempt = now;

      const name = (document.getElementById('reg-nombre')?.value || '').trim();
      const email = (document.getElementById('reg-email')?.value || '').trim();
      const birthDate = document.getElementById('reg-birthdate')?.value;
      const password = document.getElementById('reg-password')?.value;
      const confirmPassword = document.getElementById('reg-confirm-password')?.value;

      if (password !== confirmPassword) {
        alert('Las contraseñas no coinciden. Por favor verifica ambos campos.');
        document.getElementById('reg-confirm-password')?.focus();
        return;
      }

      const submitBtn = document.getElementById('reg-submit-btn');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="material-symbols-outlined text-sm animate-spin">sync</span> Validando seguridad y creando cuenta...`;
      }

      try {
        await SupabaseAPI.register(name, email, password, birthDate);
        alert('¡Cuenta creada exitosamente! Bienvenido a 123AcademiaTech.');
        window.location.href = "index.html";
      } catch (err) {
        console.error('Error durante registro:', err);
        let errorMsg = err.message || 'No se pudo completar el registro';
        if (errorMsg === 'Failed to fetch' || errorMsg.includes('fetch')) {
          errorMsg = 'No se pudo establecer conexión con el servidor de autenticación (Supabase). Por favor verifica tu conexión a Internet o que no haya un bloqueador de red.';
        }
        alert('Error al crear la cuenta: ' + errorMsg);
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `CREAR CUENTA`;
        }
      }
    }
  </script>
  <script src="auth-nav.js"></script>
  <script src="components.js"></script>
</body>
</html>
